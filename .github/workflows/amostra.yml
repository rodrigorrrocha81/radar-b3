name: Amostra B3 (desenvolvimento)
on:
  push:
    branches: [dev-opcoes]
    paths: [.github/workflows/amostra.yml, baixar_b3.py]
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python baixar_b3.py
      - run: |
          git config user.name "radar-b3-bot"; git config user.email "radar-b3-bot@users.noreply.github.com"
          git add -f b3_cache && git commit -m "Amostra B3 para desenvolvimento" && git push
