name: Atualização diária
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 19h17 de Brasília, depois do fechamento
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: dia
        run: python dia_de_pregao.py
      - if: steps.dia.outputs.pregao == 'sim' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt
          python coletar_e_calcular.py
          python gerar_painel.py
          git config user.name "radar-b3-bot"
          git config user.email "radar-b3-bot@users.noreply.github.com"
          git add dados.json docs/index.html historico_vi.csv carteira_simulada.json carteira_acoes.json
          git commit -m "Atualização diária $(date -u +%F)" || echo "sem mudanças"
          git push
