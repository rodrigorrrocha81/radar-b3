name: Dados históricos B3 (teste com o passado)
on:
  push:
    branches: [dados-historicos]
    paths: [historico/extrair_b3.py, .github/workflows/historico.yml]
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python historico/extrair_b3.py && ls -la historico
      - run: |
          git config user.name "radar-b3-bot"; git config user.email "radar-b3-bot@users.noreply.github.com"
          git add historico/*.csv.gz && git commit -m "Dados históricos da B3 (ações e opções)" && git pull --rebase origin dados-historicos && git push
